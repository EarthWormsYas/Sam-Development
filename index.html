<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.A.M. Development</title>
  <link id="favicon" rel="icon" href="assets/SAMd.png" />
  <style>
    :root {
      --glow-rgb: 11, 70, 64; /* Default fallback (#0B4640) */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f1117;
      background-image:
        linear-gradient(to right, #171921 1px, transparent 1px),
        linear-gradient(to bottom, #171921 1px, transparent 1px);
      background-size: 40px 40px;
      color: #e6e8ef;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Pin the canvas behind everything across the entire screen */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100lvh;
      z-index: -1;
    }

    /* Glowing top header bar */
    .glow-header {
      position: fixed;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(11, 13, 17, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(var(--glow-rgb), 0.35);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
      z-index: 10;
    }

    .glow-header:hover {
      border-color: rgba(var(--glow-rgb), 0.9);
      box-shadow:
        0 0 24px rgba(var(--glow-rgb), 0.75),
        0 0 52px rgba(var(--glow-rgb), 0.45);
    }

    .glow-header a {
      color: #9aa1b3;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      transition: color 0.2s ease, background-color 0.2s ease;
      white-space: nowrap;
    }

    .glow-header a:hover,
    .glow-header a.active {
      color: #ffffff;
      background-color: rgba(var(--glow-rgb), 0.35);
    }

    /* Main content area */
    main {
      padding: 6rem 1.5rem 2rem;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glowing content card */
    .glow-box {
      background-color: #0b0d11;
      border: 1px solid rgba(var(--glow-rgb), 0.35);
      border-radius: 14px;
      padding: 2rem 2.25rem;
      max-width: 620px;
      text-align: left;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: box-shadow 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    }

    .glow-box:hover {
      border-color: rgba(var(--glow-rgb), 0.9);
      box-shadow:
        0 0 24px rgba(var(--glow-rgb), 0.75),
        0 0 52px rgba(var(--glow-rgb), 0.45);
      transform: translateY(-2px);
    }

    .glow-box h1 {
      font-size: 2rem;
    }

    .glow-box p {
      margin-top: 0.75rem;
      color: #d4d8e2;
      line-height: 1.65;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>

  <header class="glow-header">
    <a href="#home" data-page="home">S.A.M. Dev</a>
    <!-- Add more links here whenever you add pages to PAGES: -->
    <!-- <a href="#sam" data-page="sam">S.A.M.</a> -->
  </header>

  <main id="app"></main>
  <script>
    // ==========================================
    // COLOR HELPER & PAGE DEFINITIONS
    // ==========================================
    function parseColor(colorStr) {
      if (colorStr.startsWith("#")) {
        const hex = colorStr.replace("#", "");
        return Array.of(
          parseInt(hex.slice(0, 2), 16),
          parseInt(hex.slice(2, 4), 16),
          parseInt(hex.slice(4, 6), 16)
        );
      }
      return colorStr.match(/\d+/g).map(Number);
    }

    const PAGES = {
      home: {
        title: "SAM Development",
        icon: "assets/SAMd.png",
        dotColor: parseColor("#0B4640"),
        lineColor: parseColor("rgb(17, 87, 61)"),
        html: `
          <div class="glow-box">
            <h1>SAM Development</h1>
            <p><b>Welcome to SAM Development!</b> <i>(Simple Automated Modules)</i><br><br><b>Please consider supporting us by adding one of our bots to your servers!</b></p>
          </div>
        `
      }
    };

    let currentDotRGB = PAGES.home.dotColor.slice();
    let targetDotRGB = PAGES.home.dotColor.slice();
    let currentLineRGB = PAGES.home.lineColor.slice();
    let targetLineRGB = PAGES.home.lineColor.slice();

    function renderPage() {
      const hash = window.location.hash.replace("#", "") || "home";
      const page = PAGES[hash] || PAGES.home;
      const activeKey = PAGES[hash] ? hash : "home";

      document.title = page.title;

      const favicon = document.getElementById("favicon");
      if (favicon && page.icon) {
        favicon.href = page.icon;
      }

      const app = document.getElementById("app");
      app.style.animation = "none";
      app.offsetHeight;
      app.style.animation = null;
      app.innerHTML = page.html;

      document.querySelectorAll(".glow-header a").forEach(link => {
        link.classList.toggle("active", link.dataset.page === activeKey);
      });

      targetDotRGB = page.dotColor.slice();
      targetLineRGB = page.lineColor.slice();
    }

    window.addEventListener("hashchange", renderPage);
    renderPage();

    // ==========================================
    // CANVAS & GLIDING GRID SETTINGS
    // ==========================================
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");

    // LAPTOP VIEWPORT BASELINE (1862 x 880)
    const BASE_WIDTH = 1862;
    const BASE_HEIGHT = 880;
    const BASE_AREA = BASE_WIDTH * BASE_HEIGHT;
    const BASE_DIAGONAL = Math.hypot(BASE_WIDTH, BASE_HEIGHT);

    const BASE_PARTICLE_COUNT = 115;
    const BASE_MAX_DISTANCE = 140;
    const BASE_SPEED = 0.6;

    // GLIDING BACKGROUND GRID SETTINGS
    const GRID_SIZE = 40;
    const GRID_SPEED = 0.1;
    const gridAngle = Math.atan2(-26.7038 - (-19.4576), -25.1888 - (-11.1569));
    const gridVx = Math.cos(gridAngle) * GRID_SPEED;
    const gridVy = Math.sin(gridAngle) * GRID_SPEED;
    let gridX = 0;
    let gridY = 0;

    let particles = [];
    let currentMaxDistance = BASE_MAX_DISTANCE;
    let lastWidth = window.innerWidth;

    function getResponsiveConfig() {
      const area = canvas.width * canvas.height;
      const diagonal = Math.hypot(canvas.width, canvas.height);

      const areaScale = Math.sqrt(area / BASE_AREA);
      const count = Math.max(32, Math.round(BASE_PARTICLE_COUNT * areaScale));

      const diagRatio = Math.max(0.45, Math.min(1.25, diagonal / BASE_DIAGONAL));
      const speed = BASE_SPEED * diagRatio;
      const maxDistance = BASE_MAX_DISTANCE * Math.max(0.65, diagRatio);

      return { count, speed, maxDistance };
    }

    function initParticles() {
      const { count, speed, maxDistance } = getResponsiveConfig();
      currentMaxDistance = maxDistance;
      particles = [];

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * speed * 2,
          vy: (Math.random() - 0.5) * speed * 2,
          radius: Math.random() * 2 + 1.5
        });
      }
    }

    function resizeCanvas() {
      const widthChanged = window.innerWidth !== lastWidth;
      const heightDiff = Math.abs(window.innerHeight - canvas.height);

      if (widthChanged || heightDiff > 40) {
        lastWidth = window.innerWidth;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initParticles();
      }
    }

    window.addEventListener("resize", resizeCanvas);
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticles();

    function lerpColor(current, target, factor) {
      for (let i = 0; i < 3; i++) {
        current[i] += (target[i] - current[i]) * factor;
      }
    }

    let lastTime = performance.now();

    function animate(now) {
      const delta = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      const timeScale = delta * 60;

      // Smoothly blend dot, line, and glow colors toward active page target
      const colorFadeSpeed = Math.min(1, 0.06 * timeScale);
      lerpColor(currentDotRGB, targetDotRGB, colorFadeSpeed);
      lerpColor(currentLineRGB, targetLineRGB, colorFadeSpeed);

      const dotRGBString = currentDotRGB.map(Math.round).join(", ");
      const dotFill = `rgb(${dotRGBString})`;
      const lineBase = currentLineRGB.map(Math.round).join(", ");
      document.documentElement.style.setProperty("--glow-rgb", dotRGBString);

      // Update gliding grid position
      gridX = (gridX + gridVx * timeScale) % GRID_SIZE;
      gridY = (gridY + gridVy * timeScale) % GRID_SIZE;
      document.body.style.backgroundPosition = `${gridX}px ${gridY}px`;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx * timeScale;
        p.y += p.vy * timeScale;

        if (p.x < 0) { p.x = 0; p.vx *= -1; }
        if (p.x > canvas.width) { p.x = canvas.width; p.vx *= -1; }
        if (p.y < 0) { p.y = 0; p.vy *= -1; }
        if (p.y > canvas.height) { p.y = canvas.height; p.vy *= -1; }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = dotFill;
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dx = p.x - p2.x;
          const dy = p.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < currentMaxDistance) {
            const opacity = 1 - dist / currentMaxDistance;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(${lineBase}, ${opacity * 0.45})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
